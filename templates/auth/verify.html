{% extends 'base.html' %}

{% block title %}Подтверждение{% endblock %}

{% block content %}
<div class="text-center mb-4">
    <div class="icon-check">✅</div>
    <h1 class="h3">Подтверждение</h1>
    <p class="text-muted">
        Код отправлен на <strong>{{ phone_number }}</strong>
    </p>
</div>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="code" class="form-label">Код авторизации</label>
        <input type="text"
               class="form-control form-control-lg text-center"
               id="code"
               name="code"
               placeholder="0000"
               maxlength="4"
               pattern="\d{4}"
               required>
    </div>

    <button type="submit" class="btn btn-success btn-lg">
        Подтвердить
    </button>
</form>

<div class="mt-3 text-center">
    <a href="{% url 'login' %}" class="text-decoration-none">
        Запросить новый код
    </a>
</div>
{% endblock %}
